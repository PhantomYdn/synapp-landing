stages:
  - build
  - deploy

build-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GO_REPO_URL: "https://gitlab.com/DiodDan/gauze.git"
    FRONTEND_SRC: ".."
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  manual_confirmation: 'Build and push latest to the registry?'
  allow_failure: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - git clone --depth 1 "$GO_REPO_URL" go-repo
    - mkdir -p go-repo/frontend
    - cp -r $(ls -A | grep -v go-repo) go-repo/frontend/
    - cd go-repo
    - >
      docker build
      --build-arg FRONTEND_SRC="$FRONTEND_SRC"
      -t "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy_production:
  stage: deploy
  image: alpine:latest
  needs: ["build-image"]
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_ed25519 diod@95.181.174.188 "deploy latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'