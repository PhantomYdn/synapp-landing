build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GO_REPO_URL: "https://gitlab.com/mygroup/go-runner-service.git"
    FRONTEND_SRC: "."
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  manual_confirmation: 'Build and push $CI_COMMIT_REF_SLUG to the registry?'
  allow_failure: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - git clone --depth 1 "$GO_REPO_URL" go-repo
    - VERSION=$(node -p "require('./package.json').version")
    - >
      docker build
      -f go-repo/Dockerfile
      --build-arg FRONTEND_SRC="$FRONTEND_SRC"
      -t "$CI_REGISTRY_IMAGE:$VERSION"
      -t "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"