<svg id="_Слой_1" data-name="Слой 1" xmlns="http://www.w3.org/2000/svg" viewBox="-100 -50 1200 350" width="100%" height="100%">
    <defs>
        <!-- Larger, slower-flowing lava waves -->
        <linearGradient id="lavaFlow" x1="0" y1="0" x2="1000" y2="500" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
            <stop offset="0%" stop-color="#D94FA0"/>
            <stop offset="30%" stop-color="#FFFFFF"/>
            <stop offset="45%" stop-color="#0FA5E9"/>
            <stop offset="75%" stop-color="#D94FA0"/>
            <stop offset="100%" stop-color="#D94FA0"/>

            <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1000 -500" dur="10s" repeatCount="indefinite" />
        </linearGradient>

        <!-- Expanded filter with bigger distortion waves and larger bounds -->
        <filter id="lavaEffect" filterUnits="userSpaceOnUse" x="-300" y="-150" width="1600" height="600" color-interpolation-filters="sRGB">

            <feTurbulence type="fractalNoise" baseFrequency="0.002 0.02" numOctaves="3" result="noise">
                <animate attributeName="baseFrequency" values="0.002 0.02; 0.006 0.04; 0.002 0.02" dur="5s" repeatCount="indefinite" />
            </feTurbulence>

            <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" result="displaced"/>

            <feGaussianBlur in="displaced" stdDeviation="12" result="glow"/>

            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="glow"/>
                <feMergeNode in="displaced"/>
            </feMerge>
        </filter>

        <style>
            .cls-1, .cls-3 {
            fill: url(#lavaFlow);
            stroke: none;
            }
            .cls-2 {
            fill: none;
            stroke: url(#lavaFlow);
            stroke-linejoin: bevel;
            stroke-width: 13.22px;
            }
        </style>
    </defs>

